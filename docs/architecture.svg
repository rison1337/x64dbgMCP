<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" width="720" height="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="x64dbg MCP architecture: MCP client to mcp_stdio_launcher.py to x64dbg.py MCP server over a loopback HTTP bridge to the MCPx64dbg C++ plugin inside x64dbg">
  <defs>
    <style>
      .title { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 700; font-size: 18px; fill: #ffffff; }
      .sub   { font-size: 12.5px; fill: #ffffff; opacity: 0.82; }
      .lbl   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #94a3b8; }
      .conn  { stroke: #94a3b8; stroke-width: 2; }
      .head  { fill: #94a3b8; }
    </style>
  </defs>

  <!-- connectors -->
  <line class="conn" x1="360" y1="104" x2="360" y2="141"/>
  <path class="head" d="M354,141 L366,141 L360,151 Z"/>
  <text class="lbl" x="382" y="127">MCP stdio</text>

  <line class="conn" x1="360" y1="226" x2="360" y2="263"/>
  <path class="head" d="M354,263 L366,263 L360,273 Z"/>
  <text class="lbl" x="382" y="249">isolated server process</text>

  <line class="conn" x1="360" y1="348" x2="360" y2="385"/>
  <path class="head" d="M354,385 L366,385 L360,395 Z"/>
  <text class="lbl" x="382" y="371">HTTP 127.0.0.1:8888 · loopback</text>

  <line class="conn" x1="360" y1="470" x2="360" y2="507"/>
  <path class="head" d="M354,507 L366,507 L360,517 Z"/>
  <text class="lbl" x="382" y="493">in-process</text>

  <!-- 1. MCP client -->
  <rect x="140" y="30" width="440" height="70" rx="14" fill="#6366f1"/>
  <text class="title" x="164" y="62">MCP client</text>
  <text class="sub"   x="164" y="82">Claude · Cursor · Codex — drive it in plain language</text>

  <!-- 2. launcher -->
  <rect x="140" y="152" width="440" height="70" rx="14" fill="#8b5cf6"/>
  <text class="title" x="164" y="184">mcp_stdio_launcher.py</text>
  <text class="sub"   x="164" y="204">stdio broker · isolates the server process</text>

  <!-- 3. MCP server (hero) -->
  <rect x="140" y="274" width="440" height="70" rx="14" fill="#3b82f6"/>
  <text class="title" x="164" y="306">x64dbg.py</text>
  <text class="sub"   x="164" y="326">MCP server + ext_tools · typed reverse-engineering tools</text>

  <!-- 4. C++ plugin -->
  <rect x="140" y="396" width="440" height="70" rx="14" fill="#06b6d4"/>
  <text class="title" x="164" y="428">MCPx64dbg.dp64 / .dp32</text>
  <text class="sub"   x="164" y="448">C++ plugin loaded inside the debugger</text>

  <!-- 5. debugger -->
  <rect x="140" y="518" width="440" height="70" rx="14" fill="#10b981"/>
  <text class="title" x="164" y="550">x64dbg / x32dbg</text>
  <text class="sub"   x="164" y="570">the live debugger + your target</text>
</svg>
