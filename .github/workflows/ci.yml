name: CI

permissions:
  contents: read

on:
  push:
    branches: [ main, release-prep ]
  pull_request:

jobs:
  tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q src tools tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  build-plugin:
    name: Build plugin (both arches)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Configure (fetch SDK)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -DX64DBG_DOWNLOAD_SDK=ON
      - name: Build dp32 + dp64
        run: cmake --build build --target all_plugins --config Release
      - name: Run native bridge-core tests (both arches)
        shell: pwsh
        run: |
          ctest --test-dir build/build32 -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build/build64 -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify plugin artifacts
        shell: pwsh
        run: |
          $artifacts = @(Get-ChildItem build -Recurse -File -Include MCPx64dbg.dp32,MCPx64dbg.dp64)
          $extensions = @($artifacts.Extension | Sort-Object -Unique)
          if ($extensions -notcontains '.dp32' -or $extensions -notcontains '.dp64') {
            throw "Both dp32 and dp64 artifacts are required. Found: $($artifacts.FullName -join ', ')"
          }
          foreach ($artifact in $artifacts) {
            if ($artifact.Length -lt 50000) {
              throw "Plugin artifact is unexpectedly small: $($artifact.FullName) ($($artifact.Length) bytes)"
            }
            $stream = [IO.File]::OpenRead($artifact.FullName)
            $hasher = [Security.Cryptography.SHA256]::Create()
            try {
              $hash = ([BitConverter]::ToString($hasher.ComputeHash($stream))).Replace("-", "")
            } finally {
              $hasher.Dispose()
              $stream.Dispose()
            }
            Write-Host "$hash  $($artifact.FullName)"
          }
      - name: Upload plugins
        uses: actions/upload-artifact@v6
        with:
          name: MCPx64dbg-plugins
          path: |
            build/**/MCPx64dbg.dp64
            build/**/MCPx64dbg.dp32
          if-no-files-found: error

  build-managed-probes:
    name: Build managed probes (self-contained x86 + x64)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Publish both architectures
        shell: pwsh
        run: tools/build_managed_probe.ps1
      - name: Verify self-contained hosts
        shell: pwsh
        run: |
          foreach ($arch in @("x64", "x86")) {
            $root = Join-Path $PWD "tools\bin\managed_probe\$arch"
            foreach ($name in @(
              "x64dbg.ManagedProbe.exe",
              "hostfxr.dll",
              "coreclr.dll",
              "DOTNET-RUNTIME-LICENSE.txt",
              "DOTNET-RUNTIME-THIRD-PARTY-NOTICES.txt",
              "MANAGED-PROBE-THIRD-PARTY-NOTICES.txt"
            )) {
              $path = Join-Path $root $name
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                throw "Missing $arch managed probe file: $path"
              }
            }
            $probe = Join-Path $root "x64dbg.ManagedProbe.exe"
            $json = & $probe --pid 2147483000
            if ($LASTEXITCODE -eq 0) {
              throw "$arch managed probe unexpectedly accepted a nonexistent PID."
            }
            $payload = $json | ConvertFrom-Json
            if ($payload.schema -ne "x64dbg-mcp-managed-probe-v1") {
              throw "$arch managed probe returned an invalid schema."
            }
            $global:LASTEXITCODE = 0
          }
